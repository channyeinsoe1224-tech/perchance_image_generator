# Nginx Reverse Proxy Configuration with WebSocket Support
# Copy or include this in /etc/nginx/sites-available/perchance-studio

server {
    listen 80;
    server_name your-domain-or-vps-ip;

    # Client upload size limit
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for continuous AI generation streaming
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
